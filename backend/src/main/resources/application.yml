# ============================================
# OpsMemory Application Configuration
# ============================================

server:
  port: ${PORT:8080}

spring:
  application:
    name: opsmemory

# Hindsight Memory Service
hindsight:
  api-url: ${HINDSIGHT_API_URL:http://localhost:8888}
  bank-id: ${HINDSIGHT_BANK_ID:opsmemory}

# Groq LLM (for future Phase 2 — Spring Boot side reasoning)
groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
# Logging
logging:
  level:
    com.opsmemory: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
